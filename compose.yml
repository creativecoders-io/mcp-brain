version: '3.8'

services:
  brain-mcp:
    build: .
    container_name: brain-mcp
    environment:
      MCP_TRANSPORT: http
      PORT: "8002"
      MCP_HOST: "0.0.0.0"
      BRAIN_PATH: /brain
    expose:
      - "8002"
    volumes:
      - ./brain:/brain
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
    name: mcp-network
