[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-brain"
version = "0.1.0"
description = "MCP server for controlled local note access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"mcp>=2.0.0",
	"rank-bm25>=0.2.2",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

